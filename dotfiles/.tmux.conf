# Sergio's Tmux Config — Mirrors Ghostty features
# Prefix: Ctrl+Space

# ── Prefix ──────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Basics ──────────────────────────────────────────
set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Splits (like Ghostty) ───────────────────────────
# Use | and - for intuitive splitting (prefix required)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Direct split shortcuts (no prefix)
# Note: shadows shell's Ctrl+E (end-of-line) and Ctrl+O (accept-line)
bind -n C-e split-window -v -c "#{pane_current_path}"
bind -n C-o split-window -h -c "#{pane_current_path}"

# ── Pane navigation (Vim-style) ─────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Ctrl+Shift+Arrows (like Ghostty)
bind -n C-S-Left resize-pane -L 5
bind -n C-S-Right resize-pane -R 5
bind -n C-S-Up resize-pane -U 5
bind -n C-S-Down resize-pane -D 5

# ── Window navigation ───────────────────────────────
bind -n C-PageUp previous-window
bind -n C-PageDown next-window
bind -n C-Tab next-window
bind -n C-S-Tab previous-window

# ── Window management ───────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill-window #W? (y/n)" kill-window
bind r command-prompt -I "#W" "rename-window '%%'"

# ── Copy mode (Vim-style) ───────────────────────────
setw -g mode-keys vi
bind Escape copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# ── Clipboard integration ───────────────────────────
# Auto-copy to system clipboard when selecting with mouse
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# ── Tokyonight colors ───────────────────────────────
# Matches LazyVim default theme (dark variant)

# Status bar
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style bg=#1a1b26,fg=#a9b1d6
set -g status-left-length 40
set -g status-right-length 100

# Left: session name + window index
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26,fg=#7aa2f7] "

# Right: date, time, hostname
set -g status-right "#[fg=#565f89]%Y-%m-%d %H:%M #[bg=#7aa2f7,fg=#1a1b26,bold] #h "

# Window status
setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[bg=#3b4261,fg=#7aa2f7,bold] #I:#W "
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style fg=#3b4261
set -g pane-active-border-style fg=#7aa2f7

# Message/command line
set -g message-style bg=#1a1b26,fg=#7aa2f7
set -g message-command-style bg=#1a1b26,fg=#7aa2f7

# Copy mode highlight
setw -g mode-style bg=#3b4261,fg=#c0caf5

# Clock
setw -g clock-mode-colour #7aa2f7

# ── Session restoration (like browser "restore tabs") ──
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Continuum auto-save every 15 minutes + auto-restore on boot
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# ── Initialize TPM ──────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
